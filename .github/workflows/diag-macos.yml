# DIAGNOSTIC ONLY (fork branch diag/macos-frame-pacing, never for upstream):
# an Apple Silicon Spotifast.app with the frame logger, to measure scrolling.
name: Diagnostic macOS build

on:
  push:
    branches: [diag/metal-first-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Sizes
        run: ls -l target/release/spotifast
      - name: App bundle
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          bash packaging/macos/bundle.sh target/release/spotifast dist/Spotifast.app "$version-diag"
          cd dist && ditto -c -k --keepParent Spotifast.app Spotifast-diag-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: spotifast-metal-first-arm64
          path: dist/Spotifast-diag-arm64.zip
          if-no-files-found: error
